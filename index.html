<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For You Bbay.</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "Priestacy";
  src: local("Priestacy"),
       url("Priestacy.ttf") format("truetype"),
       url("Priestacy.otf") format("opentype");
  font-display: swap;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  color-scheme: dark;
  overflow: hidden;
  font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace;
}

#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.62) saturate(1.15);
  opacity: 0;
  transition: opacity 4s ease;
}

#bg.show {
  opacity: 1;
}

#shade {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 48%,
      rgba(255,120,170,.16) 0,
      rgba(0,0,0,0) 38%),
    radial-gradient(ellipse at center,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,.75) 100%);
}

#pages {
  position: fixed;
  inset: 0;
  opacity: 0;
  transition: opacity 5s ease;
}

body.on #pages {
  opacity: 1;
}

.page {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}

.page.show {
  opacity: 1;
  pointer-events: auto;
}

.page p {
  color: #ffc2dc;
  font-size: clamp(14px,2vw,22px);
  letter-spacing: .2em;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  filter:
    drop-shadow(0 0 3px rgba(255,255,255,.35))
    drop-shadow(0 0 14px rgba(255,120,170,.35));
}

#p2 {
  display: block;
}

#p2::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to left,
    rgba(0,0,0,.72) 0,
    rgba(0,0,0,.5) 42%,
    rgba(0,0,0,0) 72%
  );
}

#letter {
  position: absolute;
  right: 4vw;
  top: 50%;
  transform: translateY(-50%);
  width: min(46vw,760px);
  height: 86vh;
  display: flex;
  align-items: center;
}

#lt {
  width: 100%;
  font-family:
    "Priestacy",
    "Great Vibes",
    "Segoe Script",
    "Brush Script MT",
    cursive;
  line-height: 1.35;
  color: #fff;
  text-shadow:
    0 0 12px rgba(255,255,255,.35),
    0 1px 3px rgba(0,0,0,.85);
}

#lt .w {
  display: inline-block;
  opacity: 0;
}

#lt .w.on {
  animation: inkIn .9s ease-out both;
}

@keyframes inkIn {
  0% {
    opacity: 0;
    transform: translateY(12px);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}

#cap {
  position: absolute;
  left: 0;
  width: 100%;
  bottom: 13%;
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(26px,4vw,52px);
  letter-spacing: .12em;
  color: #ffe3ef;
  text-shadow:
    0 0 18px rgba(255,120,170,.9),
    0 0 40px rgba(255,120,170,.5);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 3s ease, transform 3s ease;
}

#cap.in {
  opacity: 1;
  transform: none;
}

#nav {
  position: fixed;
  bottom: 4%;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 26px;
  transition: opacity 2s;
  z-index: 5;
}

#nav.hide {
  opacity: 0;
  pointer-events: none;
}

#nav button {
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,170,205,.6);
  color: #ffc2dc;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: background .25s, transform .25s;
}

#nav button:hover {
  background: rgba(255,122,182,.28);
  transform: scale(1.08);
}

#start {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  cursor: pointer;
  z-index: 10;
  transition: opacity 1.6s ease;
}

#start b {
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(28px,4vw,48px);
  color: #ffc2dc;
  letter-spacing: .14em;
  text-shadow: 0 0 22px rgba(255,120,170,.7);
}

#start span {
  color: #8a7480;
  letter-spacing: .3em;
  font-size: 12px;
  animation: pulse 2.2s infinite;
}

#start.gone {
  opacity: 0;
  pointer-events: none;
}

body.out {
  animation: out 1.6s forwards;
}

@keyframes pulse {
  50% { opacity: .3; }
}

@keyframes out {
  to { opacity: 0; }
}

#p2::before {
  z-index: 0;
}

#p2 #pendantCanvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 50%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
  filter: drop-shadow(0 0 8px rgba(255,205,125,.22));
}

#p2 #letter {
  z-index: 2;
}

#love {
  position: absolute;
  inset: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-content: flex-start;
  align-items: center;
  gap: 6px 18px;
  padding: 1vh 2vw;
  overflow: hidden;
  pointer-events: none;
  line-height: 1.1;
}

#love .w {
  display: inline-block;
  opacity: 0;
  white-space: nowrap;
  text-shadow: 0 0 10px rgba(255,120,170,.45);
}

#love .w.on {
  animation: loveIn .9s ease-out both;
}

@keyframes loveIn {
  0% {
    opacity: 0;
    transform: translateY(12px) rotate(var(--r));
  }
  100% {
    opacity: var(--o);
    transform: rotate(var(--r));
  }
}
</style>
</head>

<body>

<video id="bg" src="video.mp4" muted playsinline preload="auto"></video>

<audio id="song" src="song.mp3" preload="auto" loop></audio>
<audio id="song2" src="song2.mp3" preload="auto"></audio>

<div id="shade"></div>

<!-- ONLY THREE PAGES -->
<div id="pages">

  <!-- PAGE 1: BOUQUET -->
  <section class="page show" id="p1">
    <canvas id="c"></canvas>
    <div id="cap">for you Bbay.</div>
  </section>

  <!-- PAGE 2: HEART PENDANT AND LETTER -->
  <section class="page" id="p2">
    <canvas id="pendantCanvas" aria-hidden="true"></canvas>
    <div id="letter">
      <p id="lt"></p>
    </div>
  </section>

  <!-- PAGE 3: HER PORTRAIT AND I LOVE YOU -->
  <section class="page" id="p3">
    <div id="love" aria-hidden="true"></div>
    <canvas id="faceCanvas" aria-hidden="true"></canvas>
  </section>

</div>

<!-- NAVIGATION -->
<nav id="nav" class="hide">
  <button id="prev" aria-label="Previous">‹</button>
  <button id="next" aria-label="Next">›</button>
</nav>

<!-- INTRO -->
<div id="start">
  <b>for you.</b>
  <span>tap to begin · sound on</span>
</div>

<script src="script.js?v=6"></script>

</body>
</html>
