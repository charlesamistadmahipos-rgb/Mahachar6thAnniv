<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diamond Ring – JIN2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;color-scheme:dark;overflow:hidden;font-family:Consolas,Menlo,"DejaVu Sans Mono",monospace}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;width:min(100vw,calc(100vh*2280/960));aspect-ratio:2280/960}
  canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 0 2px rgba(255,255,255,.3)) drop-shadow(0 0 7px rgba(170,190,255,.18))}
  .hud{position:absolute;font-size:clamp(9px,1.2vw,15px);color:#6e6878;white-space:pre}
  .bl{left:3%;bottom:11%;color:#787080}.bl2{left:3%;bottom:5%}
  .tr{right:3%;top:3.5%;color:#ff7ab6}
  #help{position:fixed;bottom:8px;width:100%;text-align:center;font-size:11px;color:#444}
</style>
</head>
<body style="background:#000">
<div id="stage">
  <canvas id="c" width="2280" height="960"></canvas>
  <div class="hud bl2" id="hud"></div>
  <div class="hud tr" id="clk"></div>
</div>
<div id="help">Space pause · R restart · S screenshot</div>
<audio id="song2" src="song2.mp3" preload="auto"></audio>
<script src="ring.js?v=5"></script>
</body>
</html>
